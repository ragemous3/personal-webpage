name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run tests and retain execution output
        shell: bash
        run: |
          mkdir -p artifacts/verification/tests
          printf 'Commit: %s\nCommand: npm test\n' "$GITHUB_SHA" > artifacts/verification/tests/test.log
          npm test 2>&1 | tee -a artifacts/verification/tests/test.log
      - name: Upload test output
        id: test-artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/tests/
          retention-days: 90
          if-no-files-found: warn
      - name: Link test output
        if: always() && steps.test-artifacts.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.test-artifacts.outputs.artifact-url }}
        run: |
          printf 'Test output (90-day retention): %s\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: echo "HUGO_VERSION=$(cat .hugo-version)" >> "$GITHUB_ENV"
      - uses: peaceiris/actions-hugo@6b1ee2dcc06c9b6629a5317fa0146473914d05e1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: node --test tests/production-assets.spec.js
      - run: npm run build
      - run: npm run build -- --base-url https://example.test/demo/
