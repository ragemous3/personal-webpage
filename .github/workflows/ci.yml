name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: echo "HUGO_VERSION=$(cat .hugo-version)" >> "$GITHUB_ENV"
      - uses: peaceiris/actions-hugo@6b1ee2dcc06c9b6629a5317fa0146473914d05e1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: node --test tests/production-assets.spec.js
      - run: npm run build
      - run: npm run build -- --base-url https://example.test/demo/
