name: Browser verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Browser checks to run
        type: choice
        options: [both, entry, controlled]
        default: both
        required: true

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: '1'
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: echo "HUGO_VERSION=$(cat .hugo-version)" >> "$GITHUB_ENV"
      - uses: peaceiris/actions-hugo@6b1ee2dcc06c9b6629a5317fa0146473914d05e1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - run: npm ci
      - name: Prepare run output
        run: mkdir -p artifacts/verification/logs
      - name: Verify untouched entry
        if: inputs.mode == 'entry' || inputs.mode == 'both'
        shell: bash
        run: npm run verify:browser -- --mode entry --evidence artifacts/verification/entry 2>&1 | tee artifacts/verification/logs/entry.log
      - name: Verify native coordination
        if: ${{ !cancelled() && (inputs.mode == 'controlled' || inputs.mode == 'both') }}
        shell: bash
        run: npm run verify:browser -- --mode controlled --evidence artifacts/verification/controlled 2>&1 | tee artifacts/verification/logs/controlled.log
      - name: Upload verification evidence
        id: verification-artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-verification-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/
          retention-days: 90
          if-no-files-found: warn
      - name: Link verification evidence
        if: always() && steps.verification-artifacts.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.verification-artifacts.outputs.artifact-url }}
        run: |
          printf 'Browser evidence (90-day retention): %s\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
