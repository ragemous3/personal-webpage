<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chat lifecycle fixture</title>
  </head>
  <body>
    <script type="module">
      import '/assets/layers/views/chatbot.component.ts';
      import { RagService } from '/assets/layers/services/chatbot.service.ts';
      import { ChatMessageModel } from '/assets/layers/data/models/chat.model.ts';

      const transport = () => {
        const listeners = new Set();
        return {
          sent: [],
          onData(listener) {
            listeners.add(listener);
            return () => listeners.delete(listener);
          },
          send(payload, requestId, action = 'query') {
            this.sent.push({ payload, requestId, action });
          },
          emit(message) {
            for (const listener of listeners) listener(message);
          },
        };
      };
      const chat = transport();
      const database = transport();
      const service = new RagService(
        chat,
        database,
        { getChunksAsync: async () => [{ index: 0, text: 'Résumé evidence' }] },
        new ChatMessageModel({ role: 'system', content: 'Use evidence.' }),
      );
      const element = document.createElement('chat-container');
      document.body.append(element);
      window.fixture = { chat, database, service, element };
      window.attachService = () => {
        element.chatbotService = service;
      };
      window.exerciseRetrieval = async () => {
        const [{ loadHnswlib, syncFileSystem }, { VectorDBHNSWData }] = await Promise.all([
          import('hnswlib-wasm'),
          import('/assets/layers/data/vectordb-hnsw.data.ts'),
        ]);
        const library = await loadHnswlib();
        const seed = new library.HierarchicalNSW('cosine', 3, 'seed.dat');
        seed.initIndex(3, 16, 200, 100);
        seed.addPoint([1, 0, 0], 0, false);
        seed.addPoint([0, 1, 0], 1, false);
        seed.addPoint([0, 0, 1], 2, false);
        await seed.writeIndex('seed.dat');
        await syncFileSystem('write');
        const database = await new Promise((resolve, reject) => {
          const request = indexedDB.open('/hnswlib-index');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        const entry = await new Promise((resolve, reject) => {
          const request = database
            .transaction('FILE_DATA', 'readonly')
            .objectStore('FILE_DATA')
            .get('/hnswlib-index/seed.dat');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        class FixedEmbeddingDatabase extends VectorDBHNSWData {
          createEmbedder = async () => async () => ({
            data: new Float32Array([1, 0, 0]),
            tolist: () => [[1, 0, 0]],
          });
        }
        const index = new FixedEmbeddingDatabase(
          {
            spaceName: 'cosine',
            dim: 3,
            indexEntry: 'data.dat',
            indexStoreName: '/hnswlib-index',
            maxEls: 3,
            nodeConnections: 16,
            efConstructor: 200,
            seedGen: 100,
            metadataPath: '/metadata.json',
            vectorsPath: '/contents.bin',
          },
          {
            loadJSON: async (_path, parse) =>
              parse({ mode: entry.mode, timestamp: entry.timestamp }),
            loadUint8Array: async () => entry.contents,
          },
          { openStore: async () => database },
        );
        try {
          await index.init(() => {});
          return await index.query('Find the first passage', 1);
        } finally {
          database.close();
        }
      };
    </script>
  </body>
</html>
